name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # One group per PR so a new push cancels its older run; pushes to master
  # get a unique group and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # macOS and Windows are opt-in: private repos bill their minutes at 10x
        # and 2x. Enable with: gh variable set CI_MACOS_ENABLED --body true
        exclude:
          - os: ${{ vars.CI_MACOS_ENABLED != 'true' && 'macos-latest' || '' }}
          - os: ${{ vars.CI_WINDOWS_ENABLED != 'true' && 'windows-latest' || '' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
